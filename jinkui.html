<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jinkui Yaolue — Ch.16: Palpitation, Hematemesis, Epistaxis, Blood Stasis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #FAF7F0;
  --text: #2C2416;
  --accent: #8B4513;
  --highlight: #F5E6CC;
  --border: #D4C5A9;
  --tooltip-bg: #FFFEF9;
  --font-zh: 'Noto Serif TC', 'Songti SC', 'SimSun', serif;
  --font-poem: 'Cormorant Garamond', 'Georgia', serif;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
::selection { background: var(--highlight); color: var(--text); }

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250, 247, 240, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  height: 64px;
}
.header-inner {
  max-width: 1100px; margin: 0 auto; padding: 0 24px;
  height: 100%; display: flex; align-items: center; justify-content: space-between;
}
.header-title h1 {
  font-family: var(--font-zh); font-size: 1.25rem; font-weight: 600;
  color: var(--text); letter-spacing: 0.02em;
}
.header-title h1 em { font-style: italic; font-weight: 400; font-family: var(--font-poem); }
.header-subtitle { font-size: 0.8rem; color: #8a7e6b; }

/* Main layout */
.main-content {
  max-width: 1100px; margin: 0 auto; padding: 24px 24px 120px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px;
}
.column-heading {
  font-family: var(--font-ui); font-size: 0.7rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.12em; color: #9e937e;
  margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
}

/* Section blocks */
.stanza {
  padding: 8px 8px; border-radius: 6px; cursor: pointer;
  transition: background-color 0.2s; margin-bottom: 4px;
}
.stanza:hover { background: rgba(245, 230, 204, 0.4); }
.stanza.active { background: var(--highlight); }

.stanza-num {
  font-family: var(--font-ui); font-size: 0.65rem; font-weight: 600;
  color: #b5a990; text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 4px;
}

/* Poem text — classical Chinese */
.poem-line {
  font-family: var(--font-zh); font-size: 1.15rem; line-height: 2.2;
  color: var(--text); letter-spacing: 0.08em;
}
.translation-line {
  font-family: var(--font-poem); font-size: 0.95rem; line-height: 1.9;
  color: #5a4e3a;
}

/* Word hover — for classical Chinese characters */
.word {
  cursor: pointer; position: relative; transition: color 0.15s; padding: 1px 0;
}
.word:hover {
  text-decoration: underline; text-decoration-style: dotted;
  text-underline-offset: 3px; text-decoration-color: var(--border);
}

/* POS colors */
.w-noun { color: #2E5090; }
.w-verb { color: #8B2500; }
.w-adj  { color: #006400; }
.w-adv  { color: #6A4C93; }
.w-prep { color: #7B6840; }
.w-part { color: #996633; }
.w-proper { color: #4682B4; }
.w-medical { color: #B22222; }

/* Tooltip */
.tooltip {
  position: absolute; z-index: 200; max-width: 360px; min-width: 200px;
  padding: 12px 14px; background: var(--tooltip-bg);
  border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 4px 20px rgba(44,36,22,0.12), 0 1px 4px rgba(44,36,22,0.06);
  font-family: var(--font-ui); font-size: 0.85rem; line-height: 1.5;
  opacity: 0; pointer-events: none; transform: translateY(4px);
  transition: opacity 0.2s, transform 0.2s;
}
.tooltip.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
.tooltip-form { font-family: var(--font-zh); font-size: 1.4rem; font-weight: 700; margin-bottom: 3px; }
.tooltip-pinyin { font-size: 0.9rem; color: #8a7e6b; font-style: italic; margin-bottom: 4px; }
.tooltip-pos {
  display: inline-block; padding: 1px 8px; font-size: 0.65rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em; color: white;
  background: var(--accent); border-radius: 3px; margin-bottom: 6px;
}
.tooltip-info { font-size: 0.8rem; color: #6d5f4a; margin-bottom: 4px; }
.tooltip-gloss {
  font-style: italic; color: #5a4e3a; padding-top: 4px; border-top: 1px solid #eae4d6;
}

/* Commentary panel */
.commentary-panel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
  height: 380px; background: var(--tooltip-bg);
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 20px rgba(44,36,22,0.08);
  transform: translateY(100%); transition: transform 0.3s ease;
}
.commentary-panel.open { transform: translateY(0); }

.commentary-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 44px; border-bottom: 1px solid var(--border);
  background: rgba(250, 247, 240, 0.6);
}
.commentary-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab-btn {
  font-family: var(--font-ui); font-size: 0.78rem; font-weight: 500;
  padding: 6px 12px; border: none; border-radius: 4px;
  background: transparent; color: #8a7e6b; cursor: pointer; transition: all 0.15s;
}
.tab-btn:hover { background: #f0ebe0; color: var(--text); }
.tab-btn.active { background: var(--accent); color: white; }
.commentary-close {
  font-size: 1.4rem; line-height: 1; border: none; background: none;
  color: #8a7e6b; cursor: pointer; padding: 4px 8px; border-radius: 4px;
}
.commentary-close:hover { color: var(--text); background: #f0ebe0; }

.commentary-body {
  padding: 16px 24px; height: calc(380px - 44px); overflow-y: auto;
}
.tab-content {
  display: none; font-family: var(--font-ui); font-size: 0.88rem;
  line-height: 1.7; color: var(--text);
}
.tab-content.active { display: block; }
.tab-content h3, .tab-content h4 {
  font-family: var(--font-poem); font-size: 1.05rem; font-weight: 600;
  margin-bottom: 6px; color: var(--accent);
}
.tab-content p { margin-bottom: 8px; }
.tab-content ul { margin: 6px 0; padding-left: 18px; }
.tab-content li { margin-bottom: 4px; }
.tab-content blockquote {
  font-family: var(--font-zh); font-size: 0.95rem;
  padding: 8px 14px; margin: 8px 0;
  background: #f5f0e6; border-left: 3px solid var(--accent);
  border-radius: 4px; line-height: 1.8;
}

.vocab-entry { margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #eae4d6; }
.vocab-entry:last-child { border-bottom: none; }
.vocab-word { font-family: var(--font-zh); font-weight: 700; font-size: 1.1rem; }
.vocab-pinyin { font-size: 0.85rem; color: #8a7e6b; font-style: italic; }
.vocab-pos { font-size: 0.72rem; color: var(--accent); text-transform: uppercase; }
.vocab-def { color: #5a4e3a; }

.syntax-box {
  padding: 10px 14px; background: #f5f0e6; border-radius: 6px;
  border-left: 3px solid var(--accent); margin-bottom: 10px;
}
.syntax-label {
  font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: #8a7e6b; margin-bottom: 4px;
}

/* Formula tables */
.tab-content table { font-size: 0.85rem; }
.tab-content th { font-weight: 600; text-align: left; }
.tab-content td, .tab-content th { padding: 4px 8px; }

/* Responsive */
@media (max-width: 768px) {
  .main-content { grid-template-columns: 1fr; gap: 24px; padding: 16px 16px 160px; }
  .header-inner { padding: 0 16px; }
  .header-title h1 { font-size: 1.05rem; }
  .commentary-panel { height: 300px; }
  .commentary-body { padding: 12px 16px; }
  .poem-line { font-size: 1rem; }
  .tab-btn { font-size: 0.72rem; padding: 5px 8px; }
}
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-title">
      <h1>金匱要略 &middot; 第十六 &mdash; 驚悸吐衄下血胸滿瘀血病</h1>
    </div>
    <span class="header-subtitle"><em>Jinkui Yaolue</em> &middot; Zhang Zhongjing (c. 200 CE) &middot; Ch. 16</span>
  </div>
</header>

<main class="main-content" id="main-content">
  <h2 class="column-heading">古文 Classical Chinese</h2>
  <h2 class="column-heading">English Translation</h2>
</main>

<div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

<aside id="commentary-panel" class="commentary-panel" aria-hidden="true">
  <div class="commentary-header">
    <div class="commentary-tabs">
      <button class="tab-btn active" data-tab="vocab">Vocabulary</button>
      <button class="tab-btn" data-tab="grammar">Grammar</button>
      <button class="tab-btn" data-tab="medicine">Medicine</button>
      <button class="tab-btn" data-tab="commentary">注疏 Commentary</button>
      <button class="tab-btn" data-tab="formula">方劑 Formula</button>
      <button class="tab-btn" data-tab="clinical">Clinical</button>
    </div>
    <button class="commentary-close" id="commentary-close">&times;</button>
  </div>
  <div class="commentary-body">
    <div class="tab-content active" id="tab-vocab"></div>
    <div class="tab-content" id="tab-grammar"></div>
    <div class="tab-content" id="tab-medicine"></div>
    <div class="tab-content" id="tab-commentary"></div>
    <div class="tab-content" id="tab-formula"></div>
    <div class="tab-content" id="tab-clinical"></div>
  </div>
</aside>

<script src="data/jinkui16_s1_3.js"></script>
<script src="data/jinkui16_s4_6.js"></script>
<script>
// Merge all sections
const SECTIONS = [...SECTIONS_1_3, ...SECTIONS_4_6];

// ============================================================
// RENDER
// ============================================================
function render() {
  const main = document.getElementById('main-content');

  SECTIONS.forEach(st => {
    // Classical Chinese section cell
    const zhDiv = document.createElement('div');
    zhDiv.className = 'stanza';
    zhDiv.dataset.stanza = st.id;

    const label = document.createElement('div');
    label.className = 'stanza-num';
    label.textContent = st.title || `Section ${st.id}`;
    zhDiv.appendChild(label);

    st.lines.forEach(line => {
      const p = document.createElement('div');
      p.className = 'poem-line';
      // For classical Chinese, wrap each character that has a word entry
      const text = line.zh;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        // Check if this character has a word annotation
        const wordInfo = st.words ? st.words.find(w => w.form === ch) : null;
        if (wordInfo && /[\u4e00-\u9fff]/.test(ch)) {
          const span = document.createElement('span');
          span.className = 'word ' + (wordInfo.cls || '');
          span.textContent = ch;
          span.dataset.stanza = st.id;
          span.dataset.form = wordInfo.form;
          p.appendChild(span);
        } else {
          p.appendChild(document.createTextNode(ch));
        }
      }
      zhDiv.appendChild(p);
    });

    zhDiv.addEventListener('click', (e) => {
      if (!e.target.closest('.word')) openCommentary(st.id);
    });
    main.appendChild(zhDiv);

    // English translation cell
    const enDiv = document.createElement('div');
    enDiv.className = 'stanza';
    enDiv.dataset.stanzaEn = st.id;
    const enLabel = document.createElement('div');
    enLabel.className = 'stanza-num';
    enLabel.textContent = '\u00a0';
    enDiv.appendChild(enLabel);
    if (st.en) {
      st.en.forEach(line => {
        const p = document.createElement('div');
        p.className = 'translation-line';
        p.textContent = line.text;
        enDiv.appendChild(p);
      });
    }
    enDiv.addEventListener('click', () => openCommentary(st.id));
    main.appendChild(enDiv);
  });
}

// ============================================================
// TOOLTIP
// ============================================================
const tooltipEl = document.getElementById('tooltip');
let currentWord = null;

document.addEventListener('click', (e) => {
  const wordEl = e.target.closest('.word');
  if (wordEl) {
    e.stopPropagation();
    showTooltip(wordEl);
    return;
  }
  hideTooltip();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTooltip(); });

function showTooltip(el) {
  const sid = parseInt(el.dataset.stanza);
  const form = el.dataset.form;
  const st = SECTIONS.find(s => s.id === sid);
  if (!st) return;
  const w = st.words.find(x => x.form === form);
  if (!w) return;

  if (currentWord) currentWord.style.background = '';
  currentWord = el;
  el.style.background = 'var(--highlight)';

  tooltipEl.innerHTML = `
    <div class="tooltip-form">${w.form}</div>
    <div class="tooltip-pinyin">${w.pinyin || ''}</div>
    <span class="tooltip-pos">${w.pos}</span>
    ${w.info ? `<div class="tooltip-info">${w.info}</div>` : ''}
    <div class="tooltip-gloss">${w.gloss}</div>
  `;

  const rect = el.getBoundingClientRect();
  let top = rect.bottom + window.scrollY + 8;
  let left = rect.left + window.scrollX;
  tooltipEl.style.visibility = 'hidden';
  tooltipEl.classList.add('visible');
  const tw = tooltipEl.offsetWidth || 200;
  const th = tooltipEl.offsetHeight || 100;
  if (rect.bottom + th + 8 > window.innerHeight) top = rect.top + window.scrollY - th - 8;
  if (left + tw > window.innerWidth - 16) left = window.innerWidth - tw - 16;
  if (left < 8) left = 8;
  tooltipEl.style.top = top + 'px';
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.visibility = '';
}

function hideTooltip() {
  if (currentWord) { currentWord.style.background = ''; currentWord = null; }
  tooltipEl.classList.remove('visible');
}

// ============================================================
// COMMENTARY PANEL
// ============================================================
const panel = document.getElementById('commentary-panel');
let currentStanza = null;

document.getElementById('commentary-close').addEventListener('click', closePanel);
panel.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

function openCommentary(stanzaId) {
  document.querySelectorAll('.stanza.active').forEach(el => el.classList.remove('active'));
  currentStanza = stanzaId;

  document.querySelectorAll(`.stanza[data-stanza="${stanzaId}"], .stanza[data-stanza-en="${stanzaId}"]`)
    .forEach(el => el.classList.add('active'));

  const st = SECTIONS.find(s => s.id === stanzaId);
  if (!st) return;

  // Vocabulary tab
  const vEl = document.getElementById('tab-vocab');
  if (st.words && st.words.length > 0) {
    vEl.innerHTML = st.words.map(w => `
      <div class="vocab-entry">
        <span class="vocab-word">${w.form}</span>
        <span class="vocab-pinyin">${w.pinyin || ''}</span>
        <span class="vocab-pos">${w.pos}</span>
        — <span class="vocab-def">${w.gloss}</span>
        ${w.info ? `<br><small style="color:#8a7e6b">${w.info}</small>` : ''}
      </div>
    `).join('');
  } else {
    vEl.innerHTML = '<p style="color:#b5a990;font-style:italic">No vocabulary notes for this section.</p>';
  }

  // Grammar
  document.getElementById('tab-grammar').innerHTML = st.grammar || '<p style="color:#b5a990;font-style:italic">No grammar notes for this section.</p>';

  // Medicine
  document.getElementById('tab-medicine').innerHTML = st.medicine || '<p style="color:#b5a990;font-style:italic">No medical analysis for this section.</p>';

  // Commentary (注疏)
  document.getElementById('tab-commentary').innerHTML = st.commentary || '<p style="color:#b5a990;font-style:italic">No traditional commentary for this section.</p>';

  // Formula (方劑)
  const fEl = document.getElementById('tab-formula');
  if (st.formula) {
    fEl.innerHTML = st.formula;
  } else {
    fEl.innerHTML = '<p style="color:#b5a990;font-style:italic">This section discusses diagnostic principles. Formulas appear in later sections.</p>';
  }

  // Clinical
  document.getElementById('tab-clinical').innerHTML = st.clinical || '<p style="color:#b5a990;font-style:italic">No clinical notes for this section.</p>';

  panel.classList.add('open');
  // Default to vocab tab, but if springAutumn exists for this section, hint it
  switchTab('vocab');
}

function closePanel() {
  panel.classList.remove('open');
  document.querySelectorAll('.stanza.active').forEach(el => el.classList.remove('active'));
  currentStanza = null;
}

function switchTab(name) {
  panel.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  panel.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === `tab-${name}`));
}

// Esc closes panel
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && panel.classList.contains('open')) closePanel();
});

// Init
render();
</script>
</body>
</html>
